<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SistemaCMJ – Contas bancárias</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/mensagens.js" defer></script>
  <script src="/js/dicas.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/cad/rotulos.js" defer></script>
  <script src="/js/banco/contas.js" defer></script>
</head>
<body data-tela="banco/contas.html" data-ajuda="banco-contas" data-exige-tela>
  <header class="topo" id="topo"></header>
  <div class="corpo">
    <nav class="menu" id="menu"></nav>
    <main class="conteudo">
      <div class="cabecalho">
        <div class="cabecalho-titulo">
          <div class="caminho">Bancos › Contas bancárias</div>
          <h1>Contas bancárias</h1>
        </div>
        <a data-dica="Abre a Lixeira já filtrada nas contas excluídas." class="link-lixeira" href="/sis/lixeira.html?item=BANCO_CONTA" id="link-lixeira" hidden>Lixeira</a>
        <button data-dica="Baixa a lista que está na tela num arquivo que o Excel abre." type="button" class="botao" id="botao-exportar" hidden>Exportar Excel</button>
        <a data-dica="Abre a ficha em branco para cadastrar uma conta corrente, caixa ou conta de permuta." class="botao botao-principal" href="/banco/conta.html" id="botao-incluir" hidden>+ Incluir</a>
        <button type="button" class="botao botao-ajuda" id="botao-ajuda" aria-label="Ajuda desta tela">?</button>
      </div>

      <form class="cartao filtros" id="filtros" role="search">
        <label data-dica="Digite parte da descrição, do nome do banco ou o número da conta. A lista atualiza sozinha." class="campo f-3">Descrição, banco ou número
          <input type="search" id="busca" maxlength="60" placeholder="Ex.: sicredi" autocomplete="off">
        </label>
        <label data-dica="Mostra só as contas de uma empresa." class="campo f-1">Empresa
          <select id="empresa"><option value="">Todas</option></select>
        </label>
        <label data-dica="Mostra só um tipo de conta." class="campo f-1">Tipo
          <select id="tipo">
            <option value="">Todos</option>
            <option value="CORRENTE">Conta corrente</option>
            <option value="POUPANCA">Poupança</option>
            <option value="APLICACAO">Aplicação</option>
            <option value="CAIXA">Caixa</option>
            <option value="PERMUTA">Permuta</option>
          </select>
        </label>
        <label data-dica="Ativas, inativas (desativadas) ou todas. As excluídas ficam na Lixeira." class="campo f-1">Situação
          <select id="situacao">
            <option value="ATIVOS">Ativas</option>
            <option value="INATIVOS">Inativas</option>
            <option value="TODOS">Todas</option>
          </select>
        </label>
      </form>

      <div class="area-lista">
        <div class="cartao">
          <div class="rolagem">
            <table class="tabela tabela-larga">
              <thead>
                <tr>
                  <th scope="col">Empresa</th>
                  <th scope="col">Descrição</th>
                  <th scope="col">Tipo</th>
                  <th scope="col">Banco</th>
                  <th scope="col">Agência / conta</th>
                  <th scope="col">Saldo inicial</th>
                  <th scope="col">OFX</th>
                  <th scope="col">Padrão</th>
                  <th scope="col">Situação</th>
                  <th scope="col" class="col-extrato" id="coluna-extrato" hidden>Extrato</th>
                </tr>
              </thead>
              <tbody id="linhas"></tbody>
            </table>
          </div>
          <div class="rodape-lista">
            <span id="contagem" aria-live="polite"></span>
            <span>Clique na linha para abrir a ficha</span>
          </div>
        </div>
        <aside class="cartao ajuda" id="ajuda" hidden></aside>
      </div>
    </main>
  </div>
</body>
</html>
