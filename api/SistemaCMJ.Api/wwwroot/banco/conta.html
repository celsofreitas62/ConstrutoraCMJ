<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SistemaCMJ – Ficha da conta</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/mensagens.js" defer></script>
  <script src="/js/dicas.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/historico.js" defer></script>
  <script src="/js/anexos.js" defer></script>
  <script src="/js/cad/rotulos.js" defer></script>
  <script src="/js/banco/conta.js" defer></script>
</head>
<body data-tela="banco/conta.html" data-menu="banco/contas.html" data-ajuda="banco-conta" data-exige-tela>
  <header class="topo" id="topo"></header>
  <div class="corpo">
    <nav class="menu" id="menu"></nav>
    <main class="conteudo">
      <div class="cabecalho">
        <div class="cabecalho-titulo">
          <a href="/banco/contas.html" id="link-voltar">‹ Voltar para a lista de Contas bancárias</a>
          <h1 id="titulo">Nova conta</h1>
          <div class="subtitulo" id="subtitulo"></div>
        </div>
        <button data-dica="Manda a conta para a lixeira (pode ser recuperada até o prazo acabar). Só dá para excluir conta sem nenhum movimento; senão, use Desativar. Pede confirmação." type="button" class="botao botao-perigo" id="botao-excluir" hidden>Excluir</button>
        <button data-dica="Desativa a conta: some das listas de escolha, mas o movimento e o histórico continuam. Se for a conta padrão da empresa ou de um centro de custo, troque a padrão antes. Pede confirmação." type="button" class="botao" id="botao-desativar" hidden>Desativar</button>
        <button data-dica="Volta a conta para as listas de escolha." type="button" class="botao" id="botao-reativar" hidden>Reativar</button>
        <button data-dica="Volta para a lista sem gravar (avisa se houver alteração)." type="button" class="botao" id="botao-cancelar">Cancelar</button>
        <button data-dica="Grava a ficha. Pede confirmação antes." type="submit" form="ficha" class="botao botao-principal" id="botao-gravar" hidden>Gravar</button>
        <button type="button" class="botao botao-ajuda" id="botao-ajuda" aria-label="Ajuda desta tela">?</button>
      </div>

      <div class="aviso-faixa" id="aviso-movimento" role="note" hidden>Esta conta já tem movimento: a empresa, o tipo e o saldo inicial não mudam mais. Para acertar o saldo, faça um lançamento de ajuste.</div>
      <div class="aviso-faixa" id="aviso-lixeira" role="note" hidden></div>

      <div class="abas" role="tablist" aria-label="Partes da ficha">
        <button type="button" class="aba" role="tab" id="aba-dados" aria-controls="painel-dados" aria-selected="true">Dados da conta</button>
        <button type="button" class="aba" role="tab" id="aba-anexos" aria-controls="painel-anexos" aria-selected="false" hidden>Anexos</button>
        <button type="button" class="aba" role="tab" id="aba-historico" aria-controls="painel-historico" aria-selected="false" hidden>Histórico</button>
      </div>

      <div class="area-lista">
        <form class="cartao" id="ficha" novalidate>
          <section class="painel-aba" role="tabpanel" id="painel-dados" aria-labelledby="aba-dados">
            <div class="grade">
              <label data-dica="Empresa titular da conta. Depois que a conta tiver movimento, não muda mais." data-obrigatorio class="campo s-2">Empresa *
                <select id="idEmpresa"><option value="">(escolha)</option></select>
              </label>
              <label data-dica="Nome curto que aparece nas escolhas e nos relatórios (ex.: Sicredi Orion, Caixa escritório). Não pode repetir na mesma empresa." data-obrigatorio class="campo s-2">Descrição *
                <input id="descricao" maxlength="60" autocomplete="off">
              </label>
              <label data-dica="Conta corrente, poupança ou aplicação (pedem banco, agência e conta); Caixa (dinheiro em espécie) ou Permuta (controle do que é pago ou recebido em bens, sem dinheiro). Depois que a conta tiver movimento, não muda mais." class="campo">Tipo
                <select id="tipo">
                  <option value="CORRENTE">Conta corrente</option>
                  <option value="POUPANCA">Poupança</option>
                  <option value="APLICACAO">Aplicação</option>
                  <option value="CAIXA">Caixa</option>
                  <option value="PERMUTA">Permuta</option>
                </select>
              </label>
              <label data-dica="Banco da conta (código e nome). Falta algum? Cadastre em Bancos › Bancos." class="campo s-2 so-banco">Banco *
                <select id="idBanco"><option value="">(escolha)</option></select>
              </label>
              <div class="campo so-banco"></div>
              <label data-dica="Número da agência, sem o dígito." class="campo so-banco">Agência *
                <input id="agencia" maxlength="10" inputmode="numeric" autocomplete="off">
              </label>
              <label data-dica="Dígito da agência, se houver." class="campo so-banco">Dígito da agência
                <input id="agenciaDv" maxlength="2" autocomplete="off">
              </label>
              <label data-dica="Número da conta, sem o dígito." class="campo so-banco">Conta *
                <input id="numero" maxlength="20" inputmode="numeric" autocomplete="off">
              </label>
              <label data-dica="Dígito da conta." class="campo so-banco">Dígito da conta
                <input id="numeroDv" maxlength="2" autocomplete="off">
              </label>
              <label data-dica="Limite do cheque especial ou da conta garantida (entra no saldo disponível). Zero se não houver." class="campo so-banco">Limite de crédito (R$)
                <input id="limiteCredito" inputmode="decimal" autocomplete="off" placeholder="0,00">
              </label>
              <label data-dica="Saldo da conta no dia informado ao lado, antes de qualquer movimento do sistema. Depois que a conta tiver movimento, não muda mais (use um lançamento de ajuste)." class="campo">Saldo inicial (R$)
                <input id="saldoInicial" inputmode="decimal" autocomplete="off" placeholder="0,00">
              </label>
              <label data-dica="Dia do saldo inicial. Obrigatório quando o saldo inicial não é zero." class="campo">Data do saldo inicial
                <input id="dtSaldoInicial" type="date">
              </label>
              <label data-dica="Código da conta no plano do contador, para a exportação contábil (opcional)." class="campo">Conta contábil
                <input id="contaContabilRef" maxlength="30" autocomplete="off">
              </label>
              <label data-dica="Posição da conta nas listas de escolha e no resumo de saldos (menor aparece primeiro)." class="campo">Ordem
                <input id="ordem" type="number" min="0" max="999">
              </label>
              <div class="campo s-4 marcacoes">
                <label data-dica="Marque se esta conta vai ser conciliada com o extrato do banco (arquivo OFX)." class="marcacao so-banco"><input type="checkbox" id="concilia"> Concilia pelo extrato (OFX)</label>
                <label data-dica="Desmarque para a conta não aparecer no resumo de saldos da tela inicial (ex.: contas encerradas ou de controle)." class="marcacao"><input type="checkbox" id="mostraSaldo" checked> Mostra o saldo no resumo</label>
              </div>
            </div>
          </section>

          <section class="painel-aba" role="tabpanel" id="painel-anexos" aria-labelledby="aba-anexos" hidden>
            <div id="anexos"></div>
          </section>

          <section class="painel-aba" role="tabpanel" id="painel-historico" aria-labelledby="aba-historico" hidden>
            <div id="historico"></div>
          </section>
        </form>
        <aside class="cartao ajuda" id="ajuda" hidden></aside>
      </div>

      <div class="rodape-ficha" id="rodape"></div>
    </main>
  </div>
</body>
</html>
