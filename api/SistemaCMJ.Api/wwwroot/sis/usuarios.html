<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SistemaCMJ – Usuários</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/mensagens.js" defer></script>
  <script src="/js/dicas.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/sis/situacao-senha.js" defer></script>
  <script src="/js/sis/usuarios.js" defer></script>
</head>
<body data-tela="sis/usuarios.html" data-ajuda="sis-usuarios" data-exige-tela>
  <header class="topo" id="topo"></header>
  <div class="corpo">
    <nav class="menu" id="menu"></nav>
    <main class="conteudo">
      <div class="cabecalho">
        <div class="cabecalho-titulo">
          <div class="caminho">Sistema › Segurança › Usuários</div>
          <h1>Usuários</h1>
        </div>
        <button data-dica="Baixa a lista que está na tela num arquivo que o Excel abre." type="button" class="botao" id="botao-exportar" hidden>Exportar Excel</button>
        <a data-dica="Abre a ficha em branco para cadastrar um usuário novo. Ele nasce com a senha provisória padrão." class="botao botao-principal" href="/sis/usuario.html" id="botao-incluir" hidden>+ Incluir</a>
        <button type="button" class="botao botao-ajuda" id="botao-ajuda" aria-label="Ajuda desta tela">?</button>
      </div>

      <form class="cartao filtros" id="filtros" role="search">
        <label data-dica="Digite parte do login, do nome ou do e-mail. A lista atualiza sozinha." class="campo f-3">Login, nome ou e-mail
          <input type="search" id="busca" maxlength="100" placeholder="Ex.: renata" autocomplete="off">
        </label>
        <label data-dica="Mostra só os usuários de um perfil." class="campo f-1">Perfil
          <select id="perfil"><option value="">Todos</option></select>
        </label>
        <label data-dica="Ativos, inativos (desativados) ou todos." class="campo f-1">Situação
          <select id="situacao">
            <option value="ATIVOS">Ativos</option>
            <option value="INATIVOS">Inativos</option>
            <option value="TODOS">Todos</option>
          </select>
        </label>
      </form>

      <div class="area-lista">
        <div class="cartao">
          <div class="rolagem">
            <table class="tabela tabela-larga">
              <thead>
                <tr>
                  <th scope="col">Login</th>
                  <th scope="col">Nome</th>
                  <th scope="col">E-mail</th>
                  <th scope="col">Perfil</th>
                  <th scope="col">Senha</th>
                  <th scope="col">Último acesso</th>
                  <th scope="col">Situação</th>
                </tr>
              </thead>
              <tbody id="linhas"></tbody>
            </table>
          </div>
          <div class="rodape-lista">
            <span id="contagem" aria-live="polite"></span>
            <span>Clique na linha para abrir a ficha</span>
          </div>
        </div>
        <aside class="cartao ajuda" id="ajuda" hidden></aside>
      </div>
    </main>
  </div>
</body>
</html>
